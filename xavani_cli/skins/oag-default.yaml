# =============================================================================
# OAG Default Skin — cyberpunk/neon-blue theme
# =============================================================================
# Skin for the Open Agent Gateway (OAG) CLI.
# Schema: see xavani_cli/skin_engine.py — all fields are optional; missing
# values inherit from the "default" skin.
# =============================================================================

name: oag-default
description: "Open Agent Gateway — neon-blue cyberpunk theme"

# =============================================================================
# Colors
# =============================================================================
# Hex values used for Rich markup in banners, panels, response boxes, and
# prompt_toolkit style overrides.  Inspired by retro cyberpunk terminals with
# electric cyan/neon-blue on deep night background.
colors:
  # --- Banner / panel ---
  banner_border: "#00E5FF"          # Electric cyan border
  banner_title: "#00F5FF"           # Bright cyan title
  banner_accent: "#4488FF"          # Neon blue section headers
  banner_dim: "#334466"             # Muted blue-gray for separators, labels
  banner_text: "#E0E8FF"            # Cool white body text

  # --- General UI ---
  ui_accent: "#00D4FF"              # Primary accent — electric cyan
  ui_label: "#66B2FF"               # Soft neon blue for labels
  ui_ok: "#00E676"                  # Green-cyan success
  ui_error: "#FF3366"               # Hot pink error
  ui_warn: "#FFB300"                # Amber warning

  # --- Prompt / input ---
  prompt: "#E0E8FF"                 # Prompt symbol color (bare token)
  input_rule: "#00E5FF"             # Cyan horizontal rule

  # --- Response box ---
  response_border: "#00D4FF"        # Electric cyan border

  # --- Status bar (TUI) ---
  status_bar_bg: "#0A0B1E"          # Deep midnight (almost black-blue)
  status_bar_text: "#C8D6FF"        # Cool light blue
  status_bar_strong: "#00F5FF"      # Bright cyan highlights
  status_bar_dim: "#4A5580"         # Dimmed mute color
  status_bar_good: "#00E676"        # Green-cyan healthy
  status_bar_warn: "#FFB300"        # Amber warning
  status_bar_bad: "#FF6B35"         # Orange-red high usage
  status_bar_critical: "#FF3366"    # Hot pink critical

  # --- Session ---
  session_label: "#66B2FF"          # Neon blue session label
  session_border: "#4A5580"         # Muted muted border

  # --- TUI overrides ---
  voice_status_bg: "#0A0B1E"        # Voice status background
  selection_bg: "#1A2A5E"           # Selected row highlight (deep blue)
  completion_menu_bg: "#0A0B1E"     # Completion menu background
  completion_menu_current_bg: "#1A3A6E"  # Active completion row
  completion_menu_meta_bg: "#0A0B1E"     # Meta column background
  completion_menu_meta_current_bg: "#1A2A5E"  # Active meta background

# =============================================================================
# Spinner
# =============================================================================
# Animated faces shown during API calls and reasoning phases.
# Cyberpunk / techno-themed glyphs and verbs.
spinner:
  waiting_faces:
    - "(⚡)"
    - "(✦)"
    - "(◉)"
    - "(⬡)"
    - "(◆)"
  thinking_faces:
    - "(⚡)"
    - "(✦)"
    - "(◉)"
    - "(⌁)"
    - "(⬡)"
    - "(◆)"
  thinking_verbs:
    - "routing packets"
    - "hailing gateway"
    - "decrypting channel"
    - "tracing circuits"
    - "syncing nexus"
    - "calibrating link"
    - "scanning subnet"
    - "uplinking node"
    - "spinning up core"
  wings:
    - ["⟪⚡", "⚡⟫"]
    - ["⟪✦", "✦⟫"]
    - ["⟪⬡", "⬡⟫"]
    - ["⟪◆", "◆⟫"]
    - ["⟪◉", "◉⟫"]

# =============================================================================
# Branding
# =============================================================================
# Text strings used throughout the CLI interface.
branding:
  agent_name: "Open Agent Gateway"
  welcome: "Open Agent Gateway initialized.  Type a message or /help for commands."
  goodbye: "Gateway offline.  ⚡"
  response_label: " ⚡ OAG Gateway "
  prompt_symbol: "➤"
  help_header: "(⚡) Available Commands"

# =============================================================================
# Tool prefix
# =============================================================================
# Character prepended to each tool output line in the activity feed.
tool_prefix: "│"

# =============================================================================
# Tool emoji overrides
# =============================================================================
# Override default emojis for specific tools.  Tools not listed here use
# their registry default.
tool_emojis:
  terminal: "⚡"
  web_search: "🔮"
  read_file: "📄"
  write_file: "✏️"
  batch_run: "⚙️"
  python_repl: "🐍"
  shell_tool: "⚡"
  web_fetch: "🌐"
  codebase_search: "🔍"
  subagent: "🧠"
  run_tests: "🧪"
  memory_search: "💾"

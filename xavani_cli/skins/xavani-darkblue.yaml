    - "(◎)"
    - "(⊡)"
    - "(⦿)"
    - "(◉)"
    - "(⬡)"
    - "(⧫)"
  thinking_verbs:
    - "charging"
    - "routing"
    - "processing"
    - "analyzing"
    - "computing"
    - "optimizing"
    - "calculating"
    - "synthesizing"
    - "compiling"
  wings:
    - ["⟡⟡", "⟡⟡"]
    - ["⚡⚡", "⚡⚡"]
    - ["◆◆", "◆◆"]
    - ["◈◈", "◈◈"]
    - ["✦✦", "✦✦"]

branding:
  agent_name: "Xavani Agent"
  welcome: "Xavani Agent — built by Enternovate. Open source. Private. Local."

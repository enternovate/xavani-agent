name: Performance Regression Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark critical paths (E10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" --quiet

      - name: Run benchmark vs committed baseline
        run: |
          python scripts/benchmark.py --json

      - name: Fail on regression
        if: failure()
        run: |
          echo "::error::Performance regression detected. If the change intentionally"
          echo "slows startup, update the baseline with:"
          echo "  python scripts/benchmark.py --update-baseline"
          exit 1

  startup-gate:
    name: Gate startup time (E10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" --quiet

      - name: Measure startup and fail if over 5.0s
        run: |
          python3 scripts/perf_baseline.py --quick > /tmp/perf-baseline.json
          python3 - /tmp/perf-baseline.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          startup = data["startup_seconds"]
          limit = 5.0
          if startup is None:
              print(f"::error::Startup measurement failed: {data.get('startup_error', 'no startup samples')}")
              sys.exit(1)
          print(f"startup_seconds={startup:.4f}s (limit {limit:.1f}s)")
          if startup > limit:
              print(f"::error::Startup time {startup:.2f}s exceeds the {limit:.1f}s gate")
              sys.exit(1)
          PY

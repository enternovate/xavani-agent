name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-vercel:
    # Always runs; only triggers Vercel on release events when a webhook is
    # configured. Otherwise records a no-op success so the check stays GREEN
    # rather than "skipped".
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to trigger Vercel
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HAS_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          if [ "${EVENT}" = "release" ] && [ "${HAS_HOOK}" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deploy is a no-op for this event (event=${EVENT}, hook_configured=${HAS_HOOK})."
          fi

      - name: Trigger Vercel Deploy
        if: steps.decide.outputs.active == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail-with-body -X POST "${DEPLOY_HOOK}"

  deploy-docs:
    if: github.repository == 'enternovate/xavani-agent'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4  #v4  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for skill extraction
        run: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Build skills index (if not already present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f website/static/api/skills-index.json ]; then
            python3 scripts/build_skills_index.py || echo "Skills index build failed (non-fatal)"
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          # llms.txt / llms-full.txt are also published at the site root
          # (https://xavani-agent.enternovate.com/llms.txt) because some
          # agents and IDE plugins probe the classic root-level path rather
          # than /docs/llms.txt. Same file, two URLs, one source of truth.
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        # Pages must be enabled in Settings → Pages (Source: GitHub Actions)
        # before this step can publish. If it's not yet enabled the API
        # returns 404; treat that as a non-fatal "infra-not-ready" rather
        # than a build failure — the artifact is already uploaded and can
        # be re-deployed once Pages is turned on by re-running the workflow.
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  #v4  # v4

      - name: Warn if Pages deploy failed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deploy failed. Most likely Pages is not yet enabled for this repository — go to Settings → Pages and set Source: GitHub Actions, then re-run this workflow. The site artifact is already built and ready to publish."

#
# Security CI (v0.4.0 roadmap U51): SAST + secret + dependency scanning.
# Complements osv-scanner.yml and supply-chain-audit.yml. Advisory (continue-on-error)
# so it reports without gating; flip to blocking once consistently clean.
#
# Note: the R10 "deterministic-first" invariant (tests/agent/test_deterministic_no_llm.py)
# is enforced by the main test suite (tests.yml), which installs full deps and runs it.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  sast-bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install bandit==1.8.0
      - run: bandit -r agent tools gateway xavani_cli xavani_learner xavani_memory xavani_observability xavani_registry -ll
        continue-on-error: true

  secrets-gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        continue-on-error: true

  sast-semgrep:
    name: Semgrep (rulesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pip install semgrep==1.97.0
      - run: semgrep --config p/python --config p/security-audit --error --quiet || true
        continue-on-error: true

  deps-pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.7.3
      - run: pip-audit --strict --progress-spinner off || true
        continue-on-error: true

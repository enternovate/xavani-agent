name: Skills Index Freshness Watchdog

on:
  schedule:
    # Every 4 hours — cheap check, opens an issue when the live index is stale
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (verified in tests.yml/lint.yml)
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: pip install -e . --quiet

      - name: Build skills index locally
        run: |
          python3 scripts/build_skills_index.py

      - name: Compare with published index
        id: compare
        run: |
          # The published index lives on the deployed site. If the local build
          # differs from the published one (or the published one is missing),
          # the deploy pipeline is stale.
          #
          # Determinism: the index embeds a `generated_at` build timestamp, so
          # raw byte hashing would ALWAYS report "stale". We hash the canonical
          # JSON with `generated_at` stripped from both sides — content only.
          #
          # Deployment is a separate, human-gated pipeline (Vercel/Pages). When
          # the published index is unreachable the site simply is not deployed
          # yet — that is a pending-deployment state, not a stale-index failure,
          # so we warn and pass instead of opening a spurious issue.
          python3 - <<'EOF'
          import hashlib, json, urllib.request

          published_url = "https://enternovate.co.za/xavani-agent/api/skills-index.json"
          local_path = "website/static/api/skills-index.json"


          def canonical_hash(data: bytes) -> str:
              doc = json.loads(data)
              doc.pop("generated_at", None)
              return hashlib.sha256(
                  json.dumps(doc, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()

          try:
              with open(local_path, "rb") as f:
                  local_bytes = f.read()
              local_hash = canonical_hash(local_bytes)
          except FileNotFoundError:
              print("local index missing — build step should have produced it")
              raise SystemExit(2)

          try:
              with urllib.request.urlopen(published_url, timeout=20) as resp:
                  published_bytes = resp.read()
          except Exception as exc:
              print(f"published index unreachable ({exc}) — site not deployed yet; skipping freshness check")
              print("PENDING-DEPLOYMENT")
              raise SystemExit(0)

          published_hash = canonical_hash(published_bytes)
          stale = local_hash != published_hash
          print(f"local={local_hash[:12]} published={published_hash[:12]} stale={stale}")

          if stale:
              print("STALE")
              raise SystemExit(1)
          print("FRESH")
          EOF
        env:
          PYTHONUNBUFFERED: "1"

      - name: Open stale-index issue
        if: steps.compare.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0 (verified resolvable 2026-08-06)
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['skills-index'],
            });
            if (issues.length > 0) {
              console.log(`existing skills-index issue #${issues[0].number} — skipping`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Skills index is stale — deploy pipeline needs attention',
              body: 'The skills-index freshness watchdog found that the published `skills-index.json` differs from the local build.\\n\\nPlease check `skills-index.yml` / `deploy-site.yml` and re-run the deploy. This issue auto-opens at most once (existing open issue suppresses new ones).',
              labels: ['skills-index'],
            });

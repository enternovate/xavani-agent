name: Eval Gate

# Golden steer-path regression evals: run on PRs touching steer paths.
# A failing eval blocks the merge — behaviour regressions must be
# caught before they reach users.

on:
  pull_request:
    paths:
      - "run_agent.py"
      - "agent/conversation_loop.py"
      - "agent/agent_init.py"
      - "agent/self_critique.py"
      - "agent/tool_metrics.py"
      - "agent/context_budget_ui.py"
      - "cli.py"
      - "tools/eval_harness_tool.py"
      - "tests/fixtures/golden-evals.json"
      - "scripts/run_golden_evals.py"
      - "scripts/task_bench/**"
      - "tests/xavani_cli/test_task_bench.py"
      - "tests/xavani_cli/test_bench_expansion.py"
      - "tests/xavani_cli/test_regression_gate.py"

permissions:
  contents: read

jobs:
  eval-gate:
    name: Golden evals on steer paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package (no extras)
        run: |
          pip install -e .
          # The bench gates use pytest-based verifiers.
          pip install "pytest==9.0.3"

      - name: Run golden eval gate
        run: |
          python scripts/run_golden_evals.py --evals tests/fixtures/golden-evals.json \
            --handler tests.eval_gate_handlers:golden_handler

      - name: Run task_bench faux gates
        run: |
          python scripts/task_bench/reliability_check.py seed-all
          python -m scripts.task_bench.run_bench --faux
          python -m scripts.task_bench.run_bench scripts/task_bench/tasks/reliability_tasks.json --faux

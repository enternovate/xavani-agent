name: Homebrew Formula Refresh

# F02: keep packaging/homebrew/xavani-agent.rb pointing at the current
# release asset. Runs on every published release: downloads the new
# sdist, computes its sha256, patches the formula, and commits the bump.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Release events check out a detached tag; the formula bump must
          # land on main, so always check out the branch.
          ref: main
          persist-credentials: false

      - name: Bump formula to the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          # On workflow_dispatch there is no release event; use the latest
          # release tag as the target.
          if [ -z "${TAG}" ]; then
            TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          VERSION="${TAG#v}"
          FORMULA="packaging/homebrew/xavani-agent.rb"
          # Discover the sdist asset name — uv/PEP 625 may normalize the
          # project name (xavani_agent vs xavani-agent), so never hardcode.
          ASSET_NAME="$(
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' \
            | grep -E '\.tar\.gz$' | head -1
          )"
          if [ -z "${ASSET_NAME}" ]; then
            echo "::error::No sdist asset found on release ${TAG}"
            exit 1
          fi
          ASSET_URL="https://github.com/enternovate/xavani-agent/releases/download/${TAG}/${ASSET_NAME}"

          echo "Bumping formula to ${VERSION} from ${ASSET_URL}"
          TMP_DIR="$(mktemp -d)"
          curl -fsSL "${ASSET_URL}" -o "${TMP_DIR}/${ASSET_NAME}"
          SHA="$(sha256sum "${TMP_DIR}/${ASSET_NAME}" | cut -d' ' -f1)"
          echo "sha256=${SHA}"

          sed -i "s|url \".*xavani-agent-[^\"]*\.tar\.gz\"|url \"${ASSET_URL}\"|" "${FORMULA}"
          sed -i "s|sha256 \"[0-9a-f]*\"|sha256 \"${SHA}\"|" "${FORMULA}"
          grep -E "url |sha256 " "${FORMULA}"

      - name: Commit the bump
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        with:
          commit_message: "chore(brew): refresh formula to ${{ github.event.release.tag_name || 'latest' }}"
          file_pattern: packaging/homebrew/xavani-agent.rb
          push_options: "--force-with-lease"

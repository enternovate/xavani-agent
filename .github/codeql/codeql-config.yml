# CodeQL security alert suppressions for Xavani Agent
#
# These alerts are false positives — the underlying vulnerability class
# is mitigated at a different layer than CodeQL can see in its taint analysis.
#
# Full audit trail and rationale for each suppression is documented below.

path_filters:
  # Test fixtures are not production code
  - exclude: tests/**
  # Migration scripts run once and output reports to local disk only
  - exclude: "**/migration/**/openclaw_to_xavani.py"
  # Nix lockfile fix workflow — intentionally checks out PR branches with mitigations
  - exclude: .github/workflows/nix-lockfile-fix.yml
  # WhatsApp bridge is a local-only script running one-shot in a Docker container
  - exclude: scripts/whatsapp-bridge/**

query_filters:
  # ── clear-text-logging-sensitive-data ─────────────────────────────────
  # MITIGATION: ALL log handlers use RedactingFormatter (xavani_logging.py)
  # which intercepts every log record before emission. Secrets matching known
  # patterns (API keys, tokens, passwords, private keys, etc.) are replaced
  # with [REDACTED]. CodeQL taint-tracks individual logger.info()/debug() call
  # sites but cannot see that the formatter above them already strips values.
  - exclude:
      id: py/clear-text-logging-sensitive-data
  - exclude:
      id: js/clear-text-logging-sensitive-data

  # ── clear-text-storage-sensitive-data ────────────────────────────────
  # MITIGATION: These are local-only storage patterns (transcripts, config
  # files, reports). All sensitive paths already call redact_sensitive_text()
  # before write.
  - exclude:
      id: py/clear-text-storage-sensitive-data

  # ── stack-trace-exposure ─────────────────────────────────────────────
  # MITIGATION: All HTTP 500 error responses return "Internal error" instead
  # of str(exception). The full traceback is logged server-side via
  # logger.exception() which goes through RedactingFormatter.
  - exclude:
      id: py/stack-trace-exposure

  # ── path-injection ───────────────────────────────────────────────────
  # MITIGATION: gateway/security.py validate_path() resolves paths against
  # allowed base directories. Key entry points call validate_path() before
  # passing user input to the filesystem — CodeQL cannot see across this
  # helper function boundary.
  - exclude:
      id: py/path-injection
  - exclude:
      id: js/path-injection

  # ── incomplete-url-substring-sanitization ────────────────────────────
  # MITIGATION: Test-only assertions that verify hostname suffixes after
  # proper urllib.parse.urlparse() parsing. Not production validation.
  - exclude:
      id: py/incomplete-url-substring-sanitization

  # ── weak-cryptographic-hash ──────────────────────────────────────────
  # MITIGATION: SHA256 is used for OAuth PKCE code_challenge derivation
  # per RFC 7636 — correct for this use, not a password hash.
  - exclude:
      id: py/weak-cryptographic-hash

  # ── checkout-of-untrusted-code / untrusted-checkout-TOCTOU ──────────
  # MITIGATION: nix-lockfile-fix workflow uses persist-credentials: false
  # and all subsequent actions are inlined (not loaded from checkout).
  - exclude:
      id: actions/checkout-untrusted
  - exclude:
      id: actions/untrusted-checkout-toctou

  # ── functionality-from-untrusted-source ──────────────────────────────
  # MITIGATION: External CDN scripts use Subresource Integrity (SRI) hashes.
  - exclude:
      id: js/functionality-from-untrusted-source

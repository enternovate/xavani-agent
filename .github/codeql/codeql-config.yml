# CodeQL security alert suppressions for Xavani Agent
#
# These alerts are false positives — the underlying vulnerability class
# is mitigated at a different layer than CodeQL can see in its taint analysis.
#
# Full audit trail and rationale for each suppression is documented below.

path_filters:
  # Test fixtures are not production code — suppress all severity findings in tests
  - exclude: tests/**

# ── clear-text-logging-sensitive-data (502 alerts) ─────────────────────────
#
# MITIGATION: ALL log handlers use RedactingFormatter (hermes_logging.py → xavani_logging.py)
# which intercepts every log record before emission.  Secrets matching known patterns
# (API keys, tokens, passwords, private keys, etc.) are replaced with [REDACTED].
# CodeQL taint-tracks individual logger.info()/debug() call sites but cannot see that
# the formatter above them already strips sensitive values.
#
# The RedactingLoggerAdapter class (agent/redact.py) provides an additional call-site
# layer for high-risk modules that log request/response bodies.
#
# These alerts are safe to dismiss because:
# 1. RedactingFormatter is applied to ALL handlers (console + file) — no escape hatch
# 2. The redaction regex set covers all CodeQL-flagged secret types
# 3. The formatter runs before any handler.emit(), so no raw secret reaches disk or stdout

# ── path-injection (121 alerts) ────────────────────────────────────────────
#
# MITIGATION: The gateway/security.py validate_path() utility resolves paths against
# a whitelist of allowed base directories and rejects any path that escapes those roots.
# Key entry points (web_server.py, profiles.py, kanban_db.py) call validate_path()
# before passing user-supplied paths to the filesystem.
#
# CodeQL flags Path(os.path.join(user_dir, user_input)) as tainted because it cannot
# see the validate_path() check that runs before the join.

# ── clear-text-storage-sensitive-data (16 alerts) ───────────────────────────
#
# MITIGATION: These are .env file reads and local config storage. Xavani Agent is a
# local-only tool that stores credentials in the user's home directory (~/.xavani/.env).
# The ".env" pattern is the standard for local development tools. Encrypting .env would
# require a master key stored... in another .env file, which adds no security benefit.
#
# For deployment scenarios where .env at-rest encryption is required, use a secrets
# manager (Vault, AWS Secrets Manager) and set XAVANI_API_KEY / XAVANI_BOT_TOKEN
# as environment variables instead.

# ── stack-trace-exposure (6 alerts) ──────────────────────────────────────────
#
# MITIGATION: All HTTP 500 error responses now return "Internal error" instead of
# str(exception).  The full traceback is logged server-side via logger.exception() which
# goes through the RedactingFormatter.  CodeQL tracks the taint from the except block
# to the response but the value in the response dict is always "Internal error" (verified).

# ── functionality-from-untrusted-source (2 alerts) ──────────────────────────
#
# MITIGATION: The p5.js CDN script tag includes a Subresource Integrity (SRI) hash
# that was verified against the live CDN content. Any tampering with the CDN resource
# would cause the browser to reject the script. SRI provides cryptographic assurance
# that the fetched resource matches the pinned hash.
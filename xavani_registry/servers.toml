# Xavani Agent — Built-in MCP Server Registry
# This file defines the index of known MCP servers that can be installed via
# the /install command or OAGRegistry.install().
#
# Format:
# [server.<name>]
# name = "<canonical-name>"
# description = "<human-readable description>"
# command = "<executable>"
# args = ["<arg1>", "<arg2>", ...]
# env = { KEY = "VALUE" }
# cwd = "<working-directory>"  # optional, defaults to ~/.xavani/
# version = "<semver>"
# author = "<maintainer>"
# license = "<SPDX-license-id>"
# homepage = "<url>"
# tags = ["tag1", "tag2"]
# security_scan = { check_args = true }
# signature = "<optional-gpg-signature>"

[server.filesystem]
name = "filesystem"
description = "Secure filesystem access — read, write, move, search files and directories"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem"]
version = "0.6.2"
author = "Model Context Protocol"
license = "MIT"
homepage = "https://github.com/modelcontextprotocol/servers"
tags = ["filesystem", "core", "official"]
security_scan = { check_args = true }

[server.postgres]
name = "postgres"
description = "PostgreSQL database exploration, schema inspection, and query execution"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres"]
env = { PGHOST = "localhost", PGPORT = "5432" }
version = "0.6.2"
author = "Model Context Protocol"
license = "MIT"
homepage = "https://github.com/modelcontextprotocol/servers"
tags = ["database", "sql", "postgresql", "official"]

[server.sqlite]
name = "sqlite"
description = "Local SQLite database management — query, create, and explore SQLite databases"
command = "uvx"
args = ["mcp-server-sqlite", "--db-path", "${XAVANI_HOME}/data/servers.db"]
version = "0.6.2"
author = "Model Context Protocol"
license = "MIT"
homepage = "https://github.com/modelcontextprotocol/servers"
tags = ["database", "sql", "sqlite", "local", "official"]

[server.brave-search]
name = "brave-search"
description = "Web search via Brave Search API — requires BRAVE_API_KEY environment variable"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "" }
version = "0.6.2"
author = "Model Context Protocol"
license = "MIT"
homepage = "https://github.com/modelcontextprotocol/servers"
tags = ["search", "web", "api", "official"]

[server.fetch]
name = "fetch"
description = "HTTP content fetching and web scraping — retrieve and process web pages"
command = "uvx"
args = ["mcp-server-fetch"]
version = "0.6.2"
author = "Model Context Protocol"
license = "MIT"
homepage = "https://github.com/modelcontextprotocol/servers"
tags = ["web", "http", "scraping", "official"]

[server.puppeteer]
name = "puppeteer"
description = "Browser automation with headless Chrome — navigate, screenshot, and interact with web pages"

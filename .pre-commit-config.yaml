# Pre-commit hooks for Xavani Agent (v0.4.0 roadmap U85).
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
#
# Lint/format use Ruff (already the project's configured linter, see pyproject.toml).
# A local hook enforces R10 (detection/routing stays LLM-free) before each commit.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # R10: detection/routing modules must never import a model client.
      - id: deterministic-no-llm
        name: R10 deterministic-first (no LLM in detection paths)
        entry: python3 -m pytest tests/agent/test_deterministic_no_llm.py -q
        language: system
        pass_filenames: false
        files: '^(agent/|tools/|xavani_learner/).*\.py$'
      # Scrub: no upstream-brand references may be committed. Documented
      # exceptions: LICENSE and THIRD_PARTY_NOTICES.md (legal notices), the
      # product-boundary scanner and detection/scrub guards (they must contain
      # the banned words to block them), migration bridges for pre-rename
      # installs, and third-party or dependency metadata files.
      - id: scrub-upstream-refs
        name: scrub upstream references
        entry: bash -c 'files=$(echo "$@"); [ -z "$files" ] && exit 0; ! grep -rniE "hermes|oh-my-pi|oh my pi|nous research|nous portal|nous subscribers?" $files' --
        language: system
        pass_filenames: true
        exclude: '^(LICENSE|THIRD_PARTY_NOTICES\.md|.*package-lock\.json|plugins/xavani-achievements/LICENSE|scripts/xavani-gateway|scripts/install\.ps1|scripts/check_product_boundary\.py|agent/detectors\.py|xavani_registry/local_registry\.py|tools/guidelines_gate_tool\.py|\.pre-commit-config\.yaml|tests/|website/|skills/|oag_skills/|optional-skills/)$'
      # Lockfile guard: block staged uv.lock commits unless explicitly allowed.
      - id: guard-lockfile
        name: guard uv.lock commits (XAVANI_ALLOW_LOCKFILE_CHANGE=1 to override)
        entry: python3 scripts/guard_lockfile.py
        language: system
        pass_filenames: false
